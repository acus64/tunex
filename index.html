<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="theme-color" content="#000000" id="meta-theme-color"/>
    <title>TuneX - Unified Media Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--sidebar-bg:#121214;--visualizer-bg:#000;--player-bg:#fff;--accent-red:#ff2a2a;--text-main:#fff;--text-muted:#888;--text-dark:#111;--font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
        body{background:#f0f0f0;font-family:var(--font-family);height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center}
        .app-container{display:flex;width:1200px;height:850px;background:var(--visualizer-bg);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2);position:relative}
        .sidebar{width:280px;background:var(--sidebar-bg);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;z-index:20;overflow:hidden}
        .search-container{padding:16px 20px;background:#1e1e22;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:10px}
        .search-icon{color:var(--text-muted);font-size:14px}
        .search-input{flex:1;background:rgba(0,0,0,.3);border:1px solid #333;border-radius:6px;padding:8px 12px;color:var(--text-main);font-size:13px;outline:none;transition:all .2s}
        .search-input::placeholder{color:#666}
        .search-input:focus{border-color:var(--accent-red);background:rgba(255,42,42,.05);box-shadow:0 0 0 2px rgba(255,42,42,.1)}
        .channel-section{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden;margin-bottom:10px}
        .channel-section-title{padding:12px 24px;color:var(--accent-red);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:rgba(255,255,255,.03)}
        .channel-section-title:hover{color:var(--text-main);background:rgba(255,255,255,.08)}
        .channel-section-title i{font-size:10px;transition:transform .3s}
        .channel-section.collapsed .channel-section-title i{transform:rotate(-90deg)}
        .channel-section.collapsed .channel-list{display:none}
        .channel-list{list-style:none;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;flex:1;padding-right:8px}
        .channel-list::-webkit-scrollbar{width:6px}
        .channel-list::-webkit-scrollbar-track{background:rgba(0,0,0,.2);border-radius:3px}
        .channel-list::-webkit-scrollbar-thumb{background:#555;border-radius:3px}
        .channel-list::-webkit-scrollbar-thumb:hover{background:#777}
        .channel-item{display:flex;align-items:center;min-height:48px;padding:12px 24px;color:var(--text-muted);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        .channel-item:hover{color:var(--text-main);background:rgba(255,255,255,.05)}
        .channel-item.active{color:var(--text-main);background:var(--accent-red);font-weight:600}
        .channel-item:active{background:rgba(255,42,42,.3)}
        .remove-file-btn{opacity:0;transition:opacity .2s;background:none;border:none;color:#ff2a2a;cursor:pointer;font-size:14px;padding:0 4px;margin-left:auto}
        .channel-item:hover .remove-file-btn{opacity:1}
        .remove-file-btn:hover{background:rgba(255,42,42,.2)!important;border-radius:50%}
        .visualizer-area{flex:1;background:var(--visualizer-bg);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
        .media-player-container{width:100%;height:100%;position:absolute;top:0;left:0;z-index:5}
        #vu-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:2%;opacity:0;transition:opacity .3s;background:transparent}
        #vu-container.active{opacity:1}
        .power-meter-canvas{width:45%;max-width:600px;height:auto;aspect-ratio:4/3;filter:drop-shadow(0 0 8px rgba(255,100,0,.3))}
        video.media-player{width:100%;height:100%;object-fit:contain;background:transparent;opacity:0;transition:opacity .3s;z-index:1}
        video.media-player.show-video{opacity:1!important;background:#000}
        .loading-info{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;z-index:10;background:rgba(0,0,0,.7);padding:20px;border-radius:12px;backdrop-filter:blur(5px)}
        .spinner{border:4px solid rgba(255,255,255,.1);border-top:4px solid var(--accent-red);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 10px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .custom-controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(10px);padding:10px 20px;border-radius:30px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transition:opacity .3s;z-index:15;min-width:300px}
        .visualizer-area:hover .custom-controls,.custom-controls.visible{opacity:1}
        .controls-row{display:flex;align-items:center;gap:20px}
        .ctrl-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:16px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;pointer-events:auto!important;z-index:20}
        .ctrl-btn:hover{color:var(--accent-red);transform:scale(1.1)}
        .ctrl-btn.play-pause{background:var(--text-dark);width:40px;height:40px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
        .ctrl-btn.play-pause svg{fill:var(--accent-red);width:16px;height:16px}
        .progress-container{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;position:relative;overflow:hidden}
        .progress-bar{height:100%;background:var(--accent-red);width:0;transition:width .1s linear}
        .time-display{color:#fff;font-size:11px;font-family:monospace;margin-top:4px}
        .volume-control{display:flex;align-items:center;gap:8px}
        .volume-slider{-webkit-appearance:none;appearance:none;width:80px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;outline:none;cursor:pointer}
        .volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;background:var(--accent-red);border-radius:50%;cursor:pointer}
        .volume-icon{color:#fff;font-size:14px;cursor:pointer;width:20px;text-align:center}
        .player-panel{width:320px;background:var(--player-bg);padding:30px 20px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;position:relative;z-index:20;overflow-y:auto}
        .album-art{width:140px;height:140px;border-radius:8px;margin-bottom:20px;box-shadow:0 10px 20px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
        .album-art img{width:100%;height:100%;object-fit:contain}
        .track-info{text-align:left;width:100%;margin-bottom:20px}
        .track-title{color:var(--text-dark);font-size:18px;font-weight:700;margin-bottom:6px;line-height:1.2}
        .track-artist{color:var(--text-dark);font-size:14px;opacity:.7}
        .main-controls{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;width:100%}
        .btn{background:var(--text-dark);color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;transition:transform .1s;pointer-events:auto!important;z-index:20}
        .btn:active{transform:scale(.95)}
        .btn.secondary{background:#eee;color:#333}
        .btn.voice-btn{background:var(--accent-red)}
        .btn.voice-btn.active{background:red;animation:pulse-red 1s infinite}
        @keyframes pulse-red{0%{box-shadow:0 0 0 0 rgba(255,42,42,.7)}70%{box-shadow:0 0 0 10px rgba(255,42,42,0)}100%{box-shadow:0 0 0 0 rgba(255,42,42,0)}}
        .equalizer-visualizer{display:flex;justify-content:center;align-items:flex-end;gap:3px;height:160px;margin-bottom:15px;width:100%;overflow-x:auto;padding:10px 5px;background:rgba(0,0,0,.05);border-radius:8px}
        .eq-bar-wrapper{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;min-width:18px;height:100%}
        .eq-bar-container{width:100%;height:120px;background:linear-gradient(180deg,rgba(255,42,42,.1),rgba(255,42,42,.05));border-radius:4px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
        .eq-bar{width:100%;height:20%;background:linear-gradient(180deg,var(--accent-red),#f66);border-radius:3px;transition:height .05s ease-out;min-height:3px}
        .eq-bar.active{background:linear-gradient(180deg,red,var(--accent-red));box-shadow:0 0 8px rgba(255,42,42,.6)}
        .eq-label{font-size:8px;color:#666;font-weight:600;text-align:center;white-space:nowrap}
        .eq-controls{display:flex;gap:8px;align-items:center;width:100%;margin-bottom:10px}
        .eq-preset-select{flex:1;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:11px;background:#fff;cursor:pointer}
        .settings-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:9998;display:none;align-items:center;justify-content:center}
        .settings-overlay.active{display:flex}
        .settings-modal{background:#fff;border-radius:12px;padding:30px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .settings-modal h3{margin-bottom:20px;color:var(--text-dark);font-size:18px;display:flex;justify-content:space-between;align-items:center}
        .settings-close{background:none;border:none;font-size:24px;cursor:pointer;color:#999}
        .settings-close:hover{color:var(--accent-red)}
        .settings-modal label{font-size:12px;font-weight:600;color:#333;display:block;margin-bottom:5px}
        .settings-modal .api-input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-bottom:15px}
        .settings-modal .btn{width:100%;justify-content:center;padding:10px}
        #toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:1000;pointer-events:none}
        .voice-cmd-feedback{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--accent-red);border-radius:12px;padding:10px 20px;color:#fff;font-size:14px;z-index:9999;display:none;text-align:center;max-width:90vw;backdrop-filter:blur(10px)}
        .voice-cmd-feedback.show{display:block;animation:fadeInUp .3s}
        @keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .memory-indicator{padding:4px 24px;color:#666;font-size:10px;text-align:center;border-top:1px solid #333;margin-top:auto}
        .memory-indicator.warning{color:#ff9800}
        .memory-indicator.critical{color:#ff2a2a;animation:pulse-red 2s infinite}
        .panel-toggle-btn{display:none;position:absolute;top:15px;right:15px;background:var(--accent-red);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;z-index:1001;box-shadow:0 4px 12px rgba(0,0,0,.5);align-items:center;justify-content:center;pointer-events:auto!important}
        .panel-toggle-btn:active{transform:scale(.9)}
        @media(max-width:1200px){.app-container{width:100%;height:100vh;border-radius:0}}
        @media(max-width:900px){.sidebar{width:200px}.player-panel{width:240px}}
        @media(max-width:700px){.app-container{flex-direction:column;height:100dvh}.sidebar{width:100%;height:200px;order:2;border-top:1px solid #333}.visualizer-area{order:1;flex:1}.player-panel{display:none}.custom-controls{opacity:1;bottom:10px;width:90%}}
        @media(max-width:1200px) and (min-width:701px){.app-container{width:100%;height:100vh}.sidebar{width:220px}.player-panel{width:280px;padding:20px 15px}.album-art{width:110px;height:110px}.equalizer-visualizer{height:120px}.panel-toggle-btn{display:flex}.player-panel{position:absolute;top:0;right:0;height:100%;transform:translateX(100%);transition:transform .3s;box-shadow:-5px 0 20px rgba(0,0,0,.5);z-index:30}.player-panel.open{transform:translateX(0)}}
        @media(max-width:700px){.panel-toggle-btn{display:flex}.player-panel{display:flex!important;position:fixed;top:0;left:0;width:100%;height:100%;transform:translateX(100%);transition:transform .3s;z-index:100;padding:60px 20px 20px}.player-panel.open{transform:translateX(0)}.equalizer-visualizer{height:100px}}
    </style>
</head>
<body>
<div class="app-container">
    <button class="panel-toggle-btn" id="panel-toggle-btn" title="Equalizzatore"><i class="fas fa-sliders-h"></i></button>
    <div class="sidebar">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="channel-search" class="search-input" placeholder="Cerca canali..." autocomplete="off">
        </div>
        <div class="channel-section" id="section-streaming">
            <div class="channel-section-title" onclick="toggleSection('streaming')">
                <span><i class="fas fa-broadcast-tower"></i> Streaming</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <ul class="channel-list" id="channel-list-streaming"></ul>
        </div>
        <div class="channel-section collapsed" id="section-local">
            <div class="channel-section-title" onclick="toggleSection('local')">
                <span><i class="fas fa-folder-open"></i> File Locali</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <ul class="channel-list" id="channel-list-local"></ul>
        </div>
    </div>
    <div class="visualizer-area" id="visualizer-area">
        <div class="media-player-container" id="player-container">
            <div id="vu-container"></div>
            <video id="unified-player" class="media-player" playsinline></video>
            <div class="loading-info" id="loading-info"><div class="spinner"></div><p>Caricamento...</p></div>
            <div class="custom-controls" id="custom-controls">
                <div class="progress-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                <div class="controls-row">
                    <button class="ctrl-btn" id="ctrl-stop" title="Stop"><i class="fas fa-stop"></i></button>
                    <button class="ctrl-btn play-pause" id="ctrl-play-pause" title="Play/Pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                    <button class="ctrl-btn" id="ctrl-fullscreen" title="Schermo Intero"><i class="fas fa-expand"></i></button>
                    <div class="volume-control">
                        <span class="volume-icon" id="volume-icon"><i class="fas fa-volume-up"></i></span>
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
                    </div>
                </div>
                <div class="time-display" id="time-display">0:00 / 0:00</div>
            </div>
        </div>
    </div>
    <div class="player-panel" id="player-panel">
        <div class="album-art"><span style="color:#ccc;font-size:24px;font-weight:bold">TUNE<span style="color:#ff2a2a">X</span></span></div>
        <div class="track-info"><div class="track-title" id="current-channel">Seleziona Canale</div><div class="track-artist" id="status-text">In attesa</div></div>
        <div class="main-controls">
            <button id="media-play" class="btn"><i class="fas fa-play"></i> Play</button>
            <button id="media-stop" class="btn secondary"><i class="fas fa-stop"></i> Stop</button>
            <button id="media-previous" class="btn secondary"><i class="fas fa-step-backward"></i> Prev</button>
            <button id="media-next" class="btn secondary"><i class="fas fa-step-forward"></i> Next</button>
            <button id="shazam-btn" class="btn secondary"><i class="fas fa-music"></i></button>
            <button id="voice-cmd-btn" class="btn voice-btn"><i class="fas fa-microphone"></i></button>
            <button id="open-files-btn" class="btn secondary"><i class="fas fa-folder-open"></i></button>
            <button id="settings-btn" class="btn secondary"><i class="fas fa-cog"></i></button>
        </div>
        <div style="width:100%;margin-top:10px">
            <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:#333;text-align:center">EQUALIZZATORE</div>
            <div class="equalizer-visualizer" id="eq-visualizer"></div>
            <div class="eq-controls">
                <select id="eq-preset-select" class="eq-preset-select">
                    <option value="flat">FLAT</option><option value="bass">BASS BOOST</option><option value="vocal">VOCAL</option>
                    <option value="rock">ROCK</option><option value="electronic">ELECTRONIC</option><option value="pop">POP</option>
                    <option value="jazz">JAZZ</option><option value="classical">CLASSICAL</option><option value="hiphop">HIP HOP</option><option value="metal">METAL</option>
                </select>
                <button id="eq-add-preset-btn" class="btn secondary" style="padding:8px 12px"><i class="fas fa-plus"></i></button>
            </div>
            <button id="eq-reset" class="btn secondary" style="width:100%;margin-top:10px;justify-content:center">RESET EQ</button>
        </div>
    </div>
</div>
<div class="settings-overlay" id="settings-overlay">
    <div class="settings-modal">
        <h3><span><i class="fas fa-cog"></i> Impostazioni</span><button class="settings-close" id="settings-close">&times;</button></h3>
        <label>AI PROVIDER</label>
        <select id="settings-ai-provider" class="api-input" style="margin-bottom:15px"><option value="gemini">Google Gemini</option><option value="groq">Groq</option></select>
        <label>GEMINI API KEY</label><input type="password" id="settings-gemini-key" class="api-input" placeholder="Chiave Gemini...">
        <label>GROQ API KEY</label><input type="password" id="settings-api-input" class="api-input" placeholder="Chiave gsk_...">
        <button id="settings-save-btn" class="btn"><i class="fas fa-save"></i> SALVA</button>
    </div>
</div>
<input id="file-input" type="file" accept="audio/*,video/*" multiple style="display:none">
<div id="toast"></div>

<script>
"use strict";

// ===================== CONFIGURAZIONE =====================
const channelsData = [
  {name:'70-80.it TV',url:'https://585b674743bbb.streamlock.net/9050/9050/playlist.m3u8',type:'streaming'},
  {name:'Radio Delfino 80',url:'https://stream.radiodelfino.com:8060/radio.mp3',type:'streaming'},
  {name:'Antena 1 FM',url:'https://antenaone.crossradio.com.br/stream/1/',type:'streaming'},
  {name:'Radio Bruno TV',url:'https://router.xdevel.com/video0s975758-473/stream/playlist.m3u8',type:'streaming'},
  {name:'Radio Marte Tv',url:'https://router.xdevel.com/video0s975753-750/stream/playlist.m3u8',type:'streaming'}
];

const EQ_FREQS = [25,40,63,100,160,250,400,630,1000,1600,2500,4000,6300,10000,16000];
const EQ_FREQS_MOBILE = [32,64,125,250,500,1000,2000,4000,8000,16000];
const MAX_FILE_SIZE = 50*1024*1024;
const MAX_TOTAL_SIZE = 200*1024*1024;

// ===================== STATO GLOBALE =====================
let currentHls = null;
let currentPlaylistType = 'streaming';
let currentTrackIndex = -1;
let audioContext = null;
let audioSource = null;
let eqFilters = [];
let analyserL = null, analyserR = null;
let vuCanvasLeft, vuCanvasRight, ctxLeft, ctxRight;
let needleAngleLeft = 51, needleAngleRight = 51;
let GROQ_KEY = localStorage.getItem('tunex_groq_key') || '';
let GEMINI_KEY = localStorage.getItem('tunex_gemini_key') || '';
let AI_PROVIDER = localStorage.getItem('tunex_ai_provider') || 'gemini';
let lastVUUpdate = 0;
let VU_THROTTLE = 100;
let activeListeners = []; // per pulizia memory leak

// ===================== ELEMENTI DOM =====================
const unifiedPlayer = document.getElementById('unified-player');
const loadingInfo = document.getElementById('loading-info');
const channelListStreaming = document.getElementById('channel-list-streaming');
const channelListLocal = document.getElementById('channel-list-local');
const fileInput = document.getElementById('file-input');
const currentChannelDisplay = document.getElementById('current-channel');
const statusText = document.getElementById('status-text');
const toast = document.getElementById('toast');
const progressBar = document.getElementById('progress-bar');
const progressContainer = document.getElementById('progress-container');
const timeDisplay = document.getElementById('time-display');
const volumeSlider = document.getElementById('volume-slider');
const volumeIcon = document.getElementById('volume-icon');
const ctrlPlayPause = document.getElementById('ctrl-play-pause');
const ctrlFullscreen = document.getElementById('ctrl-fullscreen');
const playerContainer = document.getElementById('player-container');
const vuContainer = document.getElementById('vu-container');
const eqVisualizer = document.getElementById('eq-visualizer');
const eqPresetSelect = document.getElementById('eq-preset-select');
const playerPanel = document.getElementById('player-panel');

// ===================== UTILITY =====================
const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const showToast = (msg) => {
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.style.display = 'none'; }, 2500);
};
const toggleSection = (s) => document.getElementById('section-'+s).classList.toggle('collapsed');
const isM3U8 = (url) => url && url.indexOf('.m3u8') >= 0;
const formatTime = (s) => {
    if (!isFinite(s) || isNaN(s)) return 'LIVE';
    const m = Math.floor(s/60), se = Math.floor(s%60);
    return m+':'+(se<10?'0':'')+se;
};
const updatePlayPauseIcon = () => {
    if (!ctrlPlayPause) return;
    ctrlPlayPause.innerHTML = unifiedPlayer.paused ?
        '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>' :
        '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
};

// Gestione listener (evita memory leak)
const addCleanListener = (el, type, handler, opts) => {
    el.addEventListener(type, handler, opts);
    activeListeners.push({el, type, handler, opts});
};
const removeAllCleanListeners = () => {
    activeListeners.forEach(({el, type, handler, opts}) => {
        el.removeEventListener(type, handler, opts);
    });
    activeListeners = [];
};

// ===================== GESTIONE FILE LOCALI =====================
const localFileManager = {
    files: [],
    totalSize: 0,
    maxFileSize: MAX_FILE_SIZE,
    maxTotalSize: MAX_TOTAL_SIZE,
    
    addFiles: async function(fileList) {
        const added = [];
        for (let i=0; i<fileList.length; i++) {
            const f = fileList[i];
            if (f.size > this.maxFileSize) { showToast(`⚠️ ${f.name} troppo grande`); continue; }
            if (this.totalSize + f.size > this.maxTotalSize) { showToast('⚠️ Limite memoria raggiunto'); break; }
            const valid = ['audio/mpeg','audio/mp3','audio/wav','audio/ogg','audio/aac','audio/flac','video/mp4','video/webm'];
            if (!valid.includes(f.type) && !f.type.startsWith('audio/') && !f.type.startsWith('video/')) continue;
            this.totalSize += f.size;
            added.push({id:`local-${Date.now()}-${i}`, name:f.name, size:f.size, type:f.type, file:f, blobUrl:null});
        }
        this.files = this.files.concat(added);
        this.saveMeta();
        return added.length;
    },
    
    getUrl: function(id) {
        const item = this.files.find(f => f.id === id);
        if (!item) return null;
        if (!item.blobUrl) {
            item.blobUrl = URL.createObjectURL(item.file);
            setTimeout(() => { if (item.blobUrl) { URL.revokeObjectURL(item.blobUrl); item.blobUrl = null; } }, 300000);
        }
        return item.blobUrl;
    },
    
    remove: async function(id) {
        const item = this.files.find(f => f.id === id);
        if (item && item.blobUrl) URL.revokeObjectURL(item.blobUrl);
        this.files = this.files.filter(f => f.id !== id);
        this.totalSize = this.files.reduce((s,f) => s+f.size, 0);
        this.saveMeta();
    },
    
    saveMeta: function() {
        const meta = this.files.map(({id,name,size,type}) => ({id,name,size,type}));
        localStorage.setItem('tunex_local_meta', JSON.stringify(meta));
    },
    
    loadMeta: function() {
        try {
            const meta = JSON.parse(localStorage.getItem('tunex_local_meta')||'[]');
            this.files = meta;
            this.totalSize = meta.reduce((s,f) => s+(f.size||0), 0);
            return this.files.length > 0;
        } catch(e) { return false; }
    },
    
    getInfo: function() {
        const used = this.totalSize > 0 ? ((this.totalSize/this.maxTotalSize)*100).toFixed(1) : '0.0';
        return {count:this.files.length, size:this.formatSize(this.totalSize), pct:used+'%'};
    },
    
    formatSize: (b) => {
        if (b<1024) return b+' B';
        if (b<1048576) return (b/1024).toFixed(1)+' KB';
        return (b/1048576).toFixed(1)+' MB';
    }
};

// ===================== AUDIO ENGINE =====================
async function initAudio() {
    if (audioContext) return true;
    try {
        audioContext = new (window.AudioContext||window.webkitAudioContext)();
        if (audioContext.state === 'suspended') await audioContext.resume();
        
        const freqs = isMobile() ? EQ_FREQS_MOBILE : EQ_FREQS;
        if (isMobile()) eqValues = Array(freqs.length).fill(0);
        
        eqFilters = freqs.map((f,i) => {
            const flt = audioContext.createBiquadFilter();
            flt.type = 'peaking';
            flt.frequency.value = f;
            flt.Q.value = isMobile() ? 1 : 2;
            flt.gain.value = eqValues[i] || 0;
            return flt;
        });
        
        analyserL = audioContext.createAnalyser();
        analyserR = audioContext.createAnalyser();
        analyserL.fftSize = 2048;
        analyserR.fftSize = 2048;
        analyserL.smoothingTimeConstant = 0.85;
        analyserR.smoothingTimeConstant = 0.85;
        
        if (!window.masterGain) {
            window.masterGain = audioContext.createGain();
            window.masterGain.gain.value = unifiedPlayer.volume;
        }
        return true;
    } catch(e) {
        console.error('Audio init error:', e);
        return false;
    }
}

function connectEQ(el) {
    if (!audioContext || !el) return false;
    try {
        if (audioContext.state === 'suspended') audioContext.resume();
        if (!audioSource) {
            try { audioSource = audioContext.createMediaElementSource(el); }
            catch(e) { console.warn('EQ connect failed:', e); return false; }
        }
        // Scollega tutto prima di ricollegare
        [audioSource, window.masterGain, analyserL, analyserR].forEach(n => { try{n.disconnect()}catch(e){} });
        eqFilters.forEach(f => { try{f.disconnect()}catch(e){} });
        
        let chain = audioSource;
        eqFilters.forEach(f => { chain.connect(f); chain = f; });
        chain.connect(window.masterGain);
        window.masterGain.connect(audioContext.destination);
        
        const splitter = audioContext.createChannelSplitter(2);
        const lowpass = audioContext.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.value = 200;
        window.masterGain.connect(lowpass);
        lowpass.connect(splitter);
        splitter.connect(analyserL, 0);
        splitter.connect(analyserR, 1);
        
        if (!el._isVideo) startVU(false);
        return true;
    } catch(e) {
        console.error('EQ chain error:', e);
        return false;
    }
}

// ===================== VU METER =====================
function initVU() {
    if (!vuContainer) return;
    VU_THROTTLE = isMobile() ? 100 : 30;
    vuContainer.innerHTML = '';
    vuCanvasLeft = document.createElement('canvas'); vuCanvasLeft.className = 'power-meter-canvas';
    vuCanvasRight = document.createElement('canvas'); vuCanvasRight.className = 'power-meter-canvas';
    vuContainer.appendChild(vuCanvasLeft); vuContainer.appendChild(vuCanvasRight);
    ctxLeft = vuCanvasLeft.getContext('2d'); ctxRight = vuCanvasRight.getContext('2d');
    resizeVU();
    addCleanListener(window, 'resize', resizeVU);
}

function resizeVU() {
    [vuCanvasLeft, vuCanvasRight].forEach(c => {
        if (!c) return;
        const rect = c.getBoundingClientRect();
        if (rect.width > 0) {
            const dpr = window.devicePixelRatio || 1;
            c.width = rect.width * dpr;
            c.height = rect.height * dpr;
            c.getContext('2d').scale(dpr, dpr);
        }
    });
}

function drawMeter(ctx, lvl, label) {
    const w = ctx.canvas.clientWidth || 400, h = ctx.canvas.clientHeight || 300;
    if (w===0 || h===0) return;
    const cx = w/2, cy = h*0.82, r = Math.min(w,h)*0.75;
    ctx.clearRect(0,0,w,h);
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'rgba(30,15,0,0.9)'); g.addColorStop(1,'rgba(15,5,0,0.95)');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#f80'; ctx.font = `bold ${Math.max(14,w*0.04)}px monospace`; ctx.textAlign = 'center';
    ctx.fillText('POWER', cx, h*0.1);
    ctx.save(); ctx.translate(cx,cy);
    ctx.strokeStyle = '#f80'; ctx.lineWidth = 1.5;
    for (let db=-60; db<=3; db++) {
        const n = (db+60)/63, a = (-60 + n*120) * Math.PI/180;
        const isM = db%10===0 || db===3 || db===0;
        const len = isM ? r*0.08 : r*0.03;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*(r*0.95), -Math.sin(a)*(r*0.95));
        ctx.lineTo(Math.cos(a)*(r*0.95-len), -Math.sin(a)*(r*0.95-len));
        ctx.stroke();
        if (isM) {
            ctx.save(); ctx.rotate(a);
            ctx.fillStyle = '#f80'; ctx.font = `${Math.max(9,w*0.022)}px monospace`;
            ctx.fillText(db, 0, -r*0.8);
            ctx.restore();
        }
    }
    ctx.font = `bold ${Math.max(16,w*0.05)}px monospace`; ctx.fillText(label, 0, -r*0.45);
    ctx.font = `${Math.max(12,w*0.03)}px monospace`; ctx.fillText('dB', 0, -r*0.3);
    ctx.restore();
    
    let target = -60 + ((lvl+60)/63)*120;
    if (target > 60) target = 60;
    if (target < -60) target = -60;
    let cur = label==='LEFT' ? needleAngleLeft : needleAngleRight;
    const diff = target - cur;
    cur += diff > 0 ? diff*0.5 : diff*0.1;
    if (label==='LEFT') needleAngleLeft = cur; else needleAngleRight = cur;
    
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(-cur*Math.PI/180);
    ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(0,-r*0.85); ctx.lineTo(3,0);
    ctx.fillStyle = '#fa0'; ctx.shadowColor = '#f00'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0,0,r*0.04,0,Math.PI*2); ctx.fillStyle = '#110500'; ctx.fill();
    ctx.strokeStyle = '#530'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}

function calcLevel(data, vol) {
    let sum = 0;
    for (let i=1; i<=10; i++) sum += data[i];
    const avg = (sum/10) * vol;
    const n = avg/255;
    let db = n > 0.001 ? 20*Math.log10(n) - 15 : -60;
    if (db > -5) db = -5;
    if (db < -60) db = -60;
    return db;
}

function startVU(sim) {
    if (!vuContainer) return;
    vuContainer.classList.add('active');
    resizeVU();
    if (window._vuFrame) return;
    const dL = analyserL ? new Uint8Array(analyserL.frequencyBinCount) : null;
    const dR = analyserR ? new Uint8Array(analyserR.frequencyBinCount) : null;
    
    function draw() {
        window._vuFrame = requestAnimationFrame(draw);
        const now = Date.now();
        if (now - lastVUUpdate < VU_THROTTLE) return;
        lastVUUpdate = now;
        const vol = unifiedPlayer.muted ? 0 : unifiedPlayer.volume;
        if (vol <= 0.01) {
            drawMeter(ctxLeft, -60, 'LEFT');
            drawMeter(ctxRight, -60, 'RIGHT');
            return;
        }
        let ll = -60, rl = -60;
        if (sim || !analyserL) {
            if (!unifiedPlayer.paused) {
                const t = now/1000;
                ll = -15 + Math.random()*25 + Math.sin(t*12)*8;
                rl = -15 + Math.random()*25 + Math.cos(t*11)*8;
            }
        } else {
            analyserL.getByteFrequencyData(dL);
            analyserR.getByteFrequencyData(dR);
            ll = calcLevel(dL, vol);
            rl = calcLevel(dR, vol);
        }
        drawMeter(ctxLeft, ll, 'LEFT');
        drawMeter(ctxRight, rl, 'RIGHT');
    }
    draw();
    
    const visHandler = () => {
        if (document.hidden && window._vuFrame) {
            cancelAnimationFrame(window._vuFrame);
            window._vuFrame = null;
        } else if (!document.hidden && !window._vuFrame && vuContainer.classList.contains('active')) {
            draw();
        }
    };
    addCleanListener(document, 'visibilitychange', visHandler);
}

function stopVU() {
    if (!vuContainer) return;
    vuContainer.classList.remove('active');
    if (window._vuFrame) {
        cancelAnimationFrame(window._vuFrame);
        window._vuFrame = null;
    }
    needleAngleLeft = 51; needleAngleRight = 51;
    if (ctxLeft) drawMeter(ctxLeft, -60, 'LEFT');
    if (ctxRight) drawMeter(ctxRight, -60, 'RIGHT');
    // Non rimuoviamo i listener globali qui, ci pensa removeAllCleanListeners() quando serve
}

// ===================== EQUALIZZATORE =====================
let eqBars = [], eqBarContainers = [], eqUpdatePending = false;

function initEQ() {
    eqVisualizer.innerHTML = '';
    eqBars = []; eqBarContainers = [];
    const freqs = isMobile() ? EQ_FREQS_MOBILE : EQ_FREQS;
    if (isMobile() && eqValues.length !== freqs.length) {
        eqValues = Array(freqs.length).fill(0);
    }
    freqs.forEach((f,i) => {
        const wrap = document.createElement('div'); wrap.className = 'eq-bar-wrapper';
        const cont = document.createElement('div'); cont.className = 'eq-bar-container'; cont.dataset.band = i;
        const bar = document.createElement('div'); bar.className = 'eq-bar'; bar.style.height = '50%';
        cont.appendChild(bar); wrap.appendChild(cont);
        const lbl = document.createElement('div'); lbl.className = 'eq-label';
        lbl.textContent = f>=1000 ? (f/1000)+'k' : f;
        wrap.appendChild(lbl);
        eqVisualizer.appendChild(wrap);
        eqBars.push(bar); eqBarContainers.push(cont);
        
        const interact = (e) => {
            if (eqUpdatePending) return;
            eqUpdatePending = true;
            requestAnimationFrame(() => {
                const c = e.currentTarget || (e.target && e.target.closest('.eq-bar-container'));
                if (!c || !c.dataset) { eqUpdatePending = false; return; }
                const band = parseInt(c.dataset.band);
                if (isNaN(band)) { eqUpdatePending = false; return; }
                const rect = c.getBoundingClientRect();
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                const pct = Math.max(0, Math.min(100, (1 - (cy-rect.top)/rect.height)*100));
                const gain = (pct/100)*24 - 12;
                eqValues[band] = gain;
                const bEl = c.querySelector('.eq-bar');
                if (bEl) {
                    bEl.style.height = Math.max(5, Math.min(100, pct)) + '%';
                    bEl.classList.toggle('active', pct > 40);
                }
                if (audioContext && audioContext.state === 'running' && eqFilters[band]) {
                    eqFilters[band].gain.setTargetAtTime(Math.max(-12,Math.min(12,gain)), audioContext.currentTime, 0.05);
                }
                eqUpdatePending = false;
            });
        };
        cont.addEventListener('mousedown', interact);
        cont.addEventListener('touchstart', interact, {passive:true});
        cont.addEventListener('touchmove', interact, {passive:true});
    });
}

const defaultPresets = {

    bass:[10,10,9,8,6,4,2,0,0,0,0,0,0,0,0],
    vocal:[-4,-4,-2,0,2,6,9,10,9,6,3,0,-2,-4,-6],
    rock:[6,6,5,3,0,-2,0,3,6,8,9,8,6,4,2],
    electronic:[8,8,6,4,2,0,0,2,5,8,10,9,7,5,3],
    pop:[4,5,6,5,2,0,2,4,6,7,6,4,2,0,-2],
    jazz:[5,6,7,6,4,2,3,5,7,8,7,5,3,2,1],
    classical:[4,5,6,7,8,6,4,3,2,1,0,-2,-3,-4,-5],
    hiphop:[10,10,8,6,4,2,0,2,4,6,8,7,5,3,0],
    metal:[7,7,6,4,2,0,2,5,8,10,11,10,8,6,4]
};
let customPresets = JSON.parse(localStorage.getItem('tunex_custom_eq')||'{}');
let allPresets = Object.assign({}, defaultPresets, customPresets);

const populatePresets = () => {
    eqPresetSelect.innerHTML = '';
    Object.keys(allPresets).forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = k.toUpperCase();
        eqPresetSelect.appendChild(opt);
    });
};
populatePresets();

const applyPreset = (key) => {
    const vals = allPresets[key];
    if (!vals) return;
    if (isMobile() && eqValues.length === 10) eqValues = vals.slice(0,10);
    else eqValues = vals.slice();
    eqBars.forEach((b,i) => {
        const pct = ((eqValues[i]+12)/24)*100;
        b.style.height = Math.max(5, Math.min(100, pct))+'%';
        b.classList.toggle('active', pct>40);
    });
    if (audioContext && eqFilters.length) {
        eqValues.forEach((v,i) => {
            if (eqFilters[i]) eqFilters[i].gain.setTargetAtTime(Math.max(-12,Math.min(12,v)), audioContext.currentTime, 0.05);
        });
    }
    eqPresetSelect.value = key;
    showToast('EQ: '+key.toUpperCase());
};

eqPresetSelect.addEventListener('change', () => applyPreset(eqPresetSelect.value));
document.getElementById('eq-reset').addEventListener('click', () => applyPreset('flat'));
document.getElementById('eq-add-preset-btn').addEventListener('click', () => {
    const name = prompt('Nome preset:');
    if (name && name.trim()) {
        const key = name.trim().toLowerCase().replace(/\s+/g,'_');
        allPresets[key] = eqValues.slice();
        customPresets[key] = eqValues.slice();
        localStorage.setItem('tunex_custom_eq', JSON.stringify(customPresets));
        populatePresets();
        eqPresetSelect.value = key;
        showToast('✅ Preset salvato!');
    }
});

// ===================== RIPRODUZIONE =====================
function stopStream() {
    unifiedPlayer.pause();
    if (unifiedPlayer.src && unifiedPlayer.src.startsWith('blob:')) URL.revokeObjectURL(unifiedPlayer.src);
    unifiedPlayer.removeAttribute('src');
    unifiedPlayer.src = '';
    unifiedPlayer.load();
    if (currentHls) { try{currentHls.destroy()}catch(e){} currentHls = null; }
    statusText.textContent = 'Fermato';
    loadingInfo.style.display = 'none';
    stopVU();
    unifiedPlayer.classList.remove('show-video');
    progressBar.style.width = '0%';
    timeDisplay.textContent = '0:00 / 0:00';
    if (audioContext && audioContext.state !== 'closed') {
        try { audioContext.suspend(); } catch(e) {}
    }
    removeAllCleanListeners(); // pulizia memory leak
}

function playChannel(name, url, index) {
    currentPlaylistType = 'streaming';
    currentTrackIndex = index;
    currentChannelDisplay.textContent = name;
    statusText.textContent = 'Caricamento...';
    stopStream();
    if (isM3U8(url)) {
        if (window.Hls && Hls.isSupported()) playHLS(name, url);
        else if (unifiedPlayer.canPlayType('application/vnd.apple.mpegurl')) playStandard(name, url);
        else showToast('Formato non supportato');
    } else {
        playStandard(name, url);
    }
}

function playHLS(name, url) {
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    stopVU();
    unifiedPlayer.classList.remove('show-video');
    const mob = isMobile();
    currentHls = new Hls({
        maxBufferLength: mob?10:30,
        maxBufferSize: mob?5e6:30e6,
        startLevel: mob?0:-1,
        maxLoadingDelay: 2,
        maxRetryCount: 2,
        manifestLoadingTimeOut: 10000,
        fragLoadingTimeOut: 10000
    });
    currentHls.loadSource(url);
    currentHls.attachMedia(unifiedPlayer);
    loadingInfo.style.display = 'none';
    let retry = 0;
    
    currentHls.on(Hls.Events.MANIFEST_PARSED, async () => {
        try {
            await new Promise(res => {
                addCleanListener(unifiedPlayer, 'loadedmetadata', res, {once:true});
                setTimeout(res, 2000);
            });
            await new Promise(res => setTimeout(res, 300));
            const hasVid = unifiedPlayer.videoWidth>0 && unifiedPlayer.videoHeight>0;
            unifiedPlayer._isVideo = hasVid;
            if (hasVid) {
                stopVU();
                unifiedPlayer.classList.add('show-video');
            } else {
                unifiedPlayer.classList.remove('show-video');
                await initAudio();
                if (!connectEQ(unifiedPlayer)) startVU(true);
            }
            await unifiedPlayer.play().catch(e => {
                if (e.name === 'NotAllowedError') {
                    unifiedPlayer.muted = true;
                    unifiedPlayer.play();
                    unifiedPlayer.muted = false;
                }
            });
            statusText.textContent = 'In riproduzione';
        } catch(e) {
            statusText.textContent = 'Premi Play';
        }
    });
    
    currentHls.on(Hls.Events.ERROR, (e,d) => {
        if (d.fatal) {
            if (d.type === Hls.ErrorTypes.NETWORK_ERROR && ++retry < 3) {
                showToast(`Riprovo... (${retry}/3)`);
                currentHls.startLoad();
            } else {
                showToast('Stream non disponibile');
                stopStream();
            }
        }
    });
}

function playStandard(name, url) {
    stopStream();
    unifiedPlayer.src = url;
    
    const onLoaded = async () => {
        await new Promise(res => setTimeout(res, 300));
        const hasVid = unifiedPlayer.videoWidth>0 && unifiedPlayer.videoHeight>0;
        unifiedPlayer._isVideo = hasVid;
        if (hasVid) {
            stopVU();
            unifiedPlayer.classList.add('show-video');
        } else {
            unifiedPlayer.classList.remove('show-video');
            await initAudio();
            if (!connectEQ(unifiedPlayer)) startVU(true);
        }
        try {
            await unifiedPlayer.play().catch(e => {
                if (e.name === 'NotAllowedError') {
                    unifiedPlayer.muted = true;
                    unifiedPlayer.play();
                    unifiedPlayer.muted = false;
                }
            });
            statusText.textContent = 'In riproduzione';
        } catch(e) {
            statusText.textContent = 'Premi Play';
        }
    };
    addCleanListener(unifiedPlayer, 'loadedmetadata', onLoaded, {once:true});
    addCleanListener(unifiedPlayer, 'error', () => { statusText.textContent = 'Stream offline'; }, {once:true});
    if (unifiedPlayer.readyState < 1) unifiedPlayer.load();
}

async function playLocalFile(id) {
    const item = localFileManager.files.find(f => f.id === id);
    if (!item) { showToast('File non trovato'); return; }
    stopStream();
    loadingInfo.style.display = 'block';
    statusText.textContent = 'Caricamento file...';
    try {
        const url = localFileManager.getUrl(id);
        if (!url) throw new Error('URL non disponibile');
        unifiedPlayer.src = url;
        await new Promise((res, rej) => {
            const timeout = setTimeout(() => rej(new Error('Timeout')), 15000);
            addCleanListener(unifiedPlayer, 'loadedmetadata', () => { clearTimeout(timeout); res(); }, {once:true});
            addCleanListener(unifiedPlayer, 'error', () => { clearTimeout(timeout); rej(new Error('Formato')); }, {once:true});
        });
        const hasVid = unifiedPlayer.videoWidth>0 && unifiedPlayer.videoHeight>0;
        unifiedPlayer._isVideo = hasVid;
        if (hasVid) {
            stopVU();
            unifiedPlayer.classList.add('show-video');
        } else {
            unifiedPlayer.classList.remove('show-video');
            await initAudio();
            if (!connectEQ(unifiedPlayer)) startVU(true);
        }
        await unifiedPlayer.play().catch(e => {
            if (e.name === 'NotAllowedError') {
                unifiedPlayer.muted = true;
                unifiedPlayer.play();
                unifiedPlayer.muted = false;
            }
        });
        statusText.textContent = 'In riproduzione';
        loadingInfo.style.display = 'none';
    } catch(e) {
        loadingInfo.style.display = 'none';
        showToast('❌ '+e.message);
        statusText.textContent = 'Errore';
    }
}

    if (!pl.length) return;
    currentTrackIndex = (currentTrackIndex + 1) % pl.length;
    const list = document.getElementById(currentPlaylistType==='local' ? 'channel-list-local' : 'channel-list-streaming');
    if (list) {
        const items = list.querySelectorAll('.channel-item');
        if (items[currentTrackIndex]) items[currentTrackIndex].click();
    }
});

ctrlPlayPause.onclick = () => { unifiedPlayer.paused ? unifiedPlayer.play() : unifiedPlayer.pause(); };
document.getElementById('ctrl-stop').onclick = stopStream;
unifiedPlayer.addEventListener('play', updatePlayPauseIcon);
unifiedPlayer.addEventListener('pause', updatePlayPauseIcon);
unifiedPlayer.addEventListener('ended', () => document.getElementById('media-next').click());
unifiedPlayer.addEventListener('timeupdate', () => {
    if (unifiedPlayer.duration && progressBar) {
        progressBar.style.width = (unifiedPlayer.currentTime/unifiedPlayer.duration)*100 + '%';
        timeDisplay.textContent = formatTime(unifiedPlayer.currentTime) + ' / ' + formatTime(unifiedPlayer.duration);
    }
});
progressContainer.addEventListener('click', (e) => {
    if (unifiedPlayer.duration && isFinite(unifiedPlayer.duration)) {
        const rect = progressContainer.getBoundingClientRect();
        unifiedPlayer.currentTime = ((e.clientX-rect.left)/rect.width) * unifiedPlayer.duration;
    }
});
ctrlFullscreen.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else {
        const target = unifiedPlayer.videoWidth>0 ? unifiedPlayer : playerContainer;
        target.requestFullscreen().catch(() => {});
    }
});

// Volume
unifiedPlayer.volume = 1;
volumeSlider.value = 100;
volumeSlider.addEventListener('input', () => {
    const v = volumeSlider.value/100;
    unifiedPlayer.volume = v;
    updateVolIcon(v);
});
volumeIcon.addEventListener('click', () => {
    if (unifiedPlayer.volume > 0) {
        volumeSlider.value = 0;
        unifiedPlayer.volume = 0;
    } else {
        volumeSlider.value = 100;
        unifiedPlayer.volume = 1;
    }
});
function updateVolIcon(v) {
    const icon = v===0 ? 'fa-volume-mute' : v<0.5 ? 'fa-volume-down' : 'fa-volume-up';
    volumeIcon.innerHTML = `<i class="fas ${icon}"></i>`;
}
unifiedPlayer.addEventListener('volumechange', () => {
    if (window.masterGain) window.masterGain.gain.value = unifiedPlayer.volume;
});

// ===================== RENDER CANALI =====================
function renderChannels() {
    channelListStreaming.innerHTML = '';
    channelsData.forEach((ch,i) => channelListStreaming.appendChild(createChannelEl(ch, i, false)));
    renderLocalFiles();
}

function createChannelEl(ch, index, isLocal) {
    const el = document.createElement('li');
    el.className = 'channel-item';
    el.textContent = ch.name;
    const isTouch = 'ontouchstart' in window;
    const activate = (e) => {
        e.preventDefault();
        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        if (isLocal) {
            currentChannelDisplay.textContent = ch.name;
            playLocalFile(ch.id);
        } else {
            playChannel(ch.name, ch.url, index);
        }
    };
    if (isTouch) el.addEventListener('touchend', activate, {passive:false});
    else el.addEventListener('click', activate);
    return el;
}

function renderLocalFiles() {
    channelListLocal.innerHTML = '';
    localFileManager.files.forEach(f => {
        const el = document.createElement('li');
        el.className = 'channel-item';
        el.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${f.name}</span>
                        <span style="font-size:10px;color:#888;margin:0 8px">${localFileManager.formatSize(f.size)}</span>
                        <button class="remove-file-btn" data-id="${f.id}">&times;</button>`;
        const isTouch = 'ontouchstart' in window;
        const activate = (e) => {
            if (e.target.classList.contains('remove-file-btn')) return;
            e.preventDefault();
            document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentChannelDisplay.textContent = f.name;
            playLocalFile(f.id);
        };
        if (isTouch) el.addEventListener('touchend', activate, {passive:false});
        else el.addEventListener('click', activate);
        el.querySelector('.remove-file-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm(`Rimuovere ${f.name}?`)) {
                await localFileManager.remove(f.id);
                renderLocalFiles();
                showToast('🗑️ Rimosso');
            }
        });
        channelListLocal.appendChild(el);
    });
    if (localFileManager.files.length > 0) {
        const info = localFileManager.getInfo();
        const div = document.createElement('div');
        div.className = 'memory-indicator';
        if (parseFloat(info.pct) > 80) div.classList.add('critical');
        else if (parseFloat(info.pct) > 60) div.classList.add('warning');
        div.textContent = `${info.count} file • ${info.size} • ${info.pct} memoria`;
        channelListLocal.appendChild(div);
        document.getElementById('section-local').classList.remove('collapsed');
    }
}

// Ricerca
document.getElementById('channel-search').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll('.channel-item').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
});

// File input
document.getElementById('open-files-btn').addEventListener('click', () => {
    const info = localFileManager.getInfo();
    showToast(`📊 ${info.count} file (${info.size})`);
    setTimeout(() => fileInput.click(), 500);
});
fileInput.addEventListener('change', async (e) => {
    if (e.target.files && e.target.files.length) {
        loadingInfo.style.display = 'block';
        try {
            const added = await localFileManager.addFiles(e.target.files);
            if (added > 0) {
                renderLocalFiles();
                showToast(`✅ ${added} file aggiunti`);
            } else {
                showToast('⚠️ Nessun file aggiunto');
            }
        } catch(err) {
            showToast('❌ Errore caricamento');
        }
        loadingInfo.style.display = 'none';
    }
    fileInput.value = '';
});

// Panel toggle
document.getElementById('panel-toggle-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    playerPanel.classList.toggle('open');
});

// Impostazioni
document.getElementById('settings-btn').addEventListener('click', () => {
    document.getElementById('settings-api-input').value = GROQ_KEY;
    document.getElementById('settings-gemini-key').value = GEMINI_KEY;
    document.getElementById('settings-ai-provider').value = AI_PROVIDER;
    document.getElementById('settings-overlay').classList.add('active');
});
document.getElementById('settings-close').addEventListener('click', () => {
    document.getElementById('settings-overlay').classList.remove('active');
});
document.getElementById('settings-save-btn').addEventListener('click', () => {
    GROQ_KEY = document.getElementById('settings-api-input').value.trim();
    GEMINI_KEY = document.getElementById('settings-gemini-key').value.trim();
    AI_PROVIDER = document.getElementById('settings-ai-provider').value;
    localStorage.setItem('tunex_groq_key', GROQ_KEY);
    localStorage.setItem('tunex_gemini_key', GEMINI_KEY);
    localStorage.setItem('tunex_ai_provider', AI_PROVIDER);
    showToast('✅ Salvato! Provider: '+AI_PROVIDER.toUpperCase());
    document.getElementById('settings-overlay').classList.remove('active');
});

// Shazam
document.getElementById('shazam-btn').addEventListener('click', () => {
    if (isMobile()) window.location.href = 'shazam://';
    else window.open('https://www.shazam.com/','_blank');
});

// ===================== VOICE AI =====================
const voiceBtn = document.getElementById('voice-cmd-btn');
let listening = false;
const voiceFb = document.createElement('div');
voiceFb.className = 'voice-cmd-feedback';
document.body.appendChild(voiceFb);
const showVF = (text, duration) => {
    voiceFb.textContent = text;
    voiceFb.classList.add('show');
    clearTimeout(voiceFb._t);
    voiceFb._t = setTimeout(() => voiceFb.classList.remove('show'), duration || 2500);
};

async function askAI(q) {
    if (AI_PROVIDER === 'gemini' && GEMINI_KEY) return askGemini(q);
    if (GROQ_KEY) return askGroq(q);
    return 'Nessuna API configurata.';
}

async function askGroq(q) {
    try {
        const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
            body:JSON.stringify({
                model:'llama-3.3-70b-versatile',
                messages:[{role:'system',content:'Sei TuneX. Rispondi in italiano, max 2 frasi.'},{role:'user',content:q}],
                temperature:0.7,
                max_tokens:100
            })
        });
        if (!r.ok) throw new Error('Errore API Groq');
        const d = await r.json();
        return d.choices?.[0]?.message?.content || 'Non ho capito.';
    } catch(e) { return 'Errore connessione.'; }
}

async function askGemini(q) {
    try {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_KEY}`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                contents:[{parts:[{text:'Sei TuneX. Rispondi in italiano, max 2 frasi. Domanda: '+q}]}]
            })
        });
        if (!r.ok) throw new Error('Errore API Gemini');
        const d = await r.json();
        return d.candidates?.[0]?.content?.parts?.[0]?.text || 'Non ho capito.';
    } catch(e) { return 'Errore connessione.'; }
}

async function recordAudio() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        const rec = new MediaRecorder(stream);
        const chunks = [];
        return new Promise((resolve, reject) => {
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = async () => {
                const blob = new Blob(chunks, {type:'audio/webm'});
                stream.getTracks().forEach(t => t.stop());
                if (AI_PROVIDER === 'gemini' && GEMINI_KEY) {
                    const b64 = await new Promise(res2 => {
                        const fr = new FileReader();
                        fr.onloadend = () => res2(fr.result.split(',')[1]);
                        fr.readAsDataURL(blob);
                    });
                    try {
                        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro-vision:generateContent?key=${GEMINI_KEY}`, {
                            method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({
                                contents:[{parts:[
                                    {text:'Trascrivi in italiano. Solo testo.'},
                                    {inline_data:{mime_type:'audio/webm',data:b64}}
                                ]}]
                            })
                        });
                        if (!r.ok) throw new Error('Errore API Gemini');
                        const d = await r.json();
                        resolve(d.candidates?.[0]?.content?.parts?.[0]?.text || '');
                    } catch(e) { reject(e); }
                } else if (GROQ_KEY) {
                    const fd = new FormData();
                    fd.append('file', blob, 'audio.webm');
                    fd.append('model', 'whisper-large-v3');
                    fd.append('language', 'it');
                    try {
                        const r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                            method:'POST',
                            headers:{'Authorization':'Bearer '+GROQ_KEY},
                            body:fd
                        });
                        if (!r.ok) throw new Error('Errore API Groq');
                        const d = await r.json();
                        resolve(d.text || '');
                    } catch(e) { reject(e); }
                } else {
                    reject(new Error('No API'));
                }
            };
            rec.start();
            showVF('🎤 Ascolto... (5s)');
            setTimeout(() => { rec.stop(); showVF('⏳ Elaborazione...'); }, 5000);
        });
    } catch(e) {
        showVF('❌ Microfono: '+e.message);
        return null;
    }
}

function speak(text) {
    if (!('speechSynthesis' in window)) {
        showVF(text, 5000);
        return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'it-IT';
    u.rate = 0.95;
    const wasPlaying = !unifiedPlayer.paused;
    if (wasPlaying) unifiedPlayer.pause();
    const safety = setTimeout(() => {
        if (wasPlaying) unifiedPlayer.play();
        window.speechSynthesis.cancel();
    }, 10000);
    u.onend = () => { clearTimeout(safety); if (wasPlaying) unifiedPlayer.play(); };
    u.onerror = () => { clearTimeout(safety); showVF(text, 5000); if (wasPlaying) unifiedPlayer.play(); };
    if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.onvoiceschanged = () => speechSynthesis.speak(u);
    } else {
        speechSynthesis.speak(u);
    }
}

voiceBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    if (listening) return;
    listening = true;
    voiceBtn.classList.add('active');
    const txt = await recordAudio();
    listening = false;
    voiceBtn.classList.remove('active');
    if (txt) {
        showVF('💬 "'+txt+'"');
        const lt = txt.toLowerCase();
        if (lt.includes('play') || lt.includes('riproduci')) {
            unifiedPlayer.play();
            speak('Riproduzione avviata');
        } else if (lt.includes('stop') || lt.includes('ferma')) {
            stopStream();
            speak('Fermato');
        } else if (lt.includes('next') || lt.includes('avanti')) {
            document.getElementById('media-next').click();
            speak('Successivo');
        } else if (lt.includes('prev') || lt.includes('indietro')) {
            document.getElementById('media-previous').click();
            speak('Precedente');
        } else {
            const found = channelsData.find(c => c.name.toLowerCase().includes(lt));
            if (found) {
                const items = channelListStreaming.querySelectorAll('.channel-item');
                for (let i=0; i<items.length; i++) {
                    if (items[i].textContent.includes(found.name)) {
                        items[i].click();
                        speak('Riproduco '+found.name);
                        return;
                    }
                }
            }
            const ans = await askAI(txt);
            showVF('🤖 '+ans);
            speak(ans);
        }
    }
});

// Touch gesture doppio tap per fullscreen
let lastTap = 0;
document.getElementById('visualizer-area').addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 300) {
        e.preventDefault();
        ctrlFullscreen.click();
    }
    lastTap = now;
});

// ===================== INIZIALIZZAZIONE =====================
(async () => {
    if (await localFileManager.loadMeta()) {
        renderLocalFiles();
        showToast('📂 '+localFileManager.getInfo().count+' file recuperati');
    }
    renderChannels();
    initVU();
    initEQ();
    document.addEventListener('touchstart', async () => {
        if (audioContext && audioContext.state === 'suspended') await audioContext.resume();
    }, {once: false});
})();
